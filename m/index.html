function renderTabs(){
  var r=[["all","🌍 全部"],["cn","🇨🇳 国内"],["us","🇺🇸 海外"]];
  document.getElementById("region").innerHTML = r.map(function(x){

  }).join("");
  document.getElementById("cat").innerHTML = cats.map(function(c){
    return '<button class="tab '+(cat==c?"on":"")+'" data-c="'+c+'">'+fmtCats(c)+'</button>';
  }).join("");
  var rb=document.querySelectorAll("[data-r]"), cb=document.querySelectorAll("[data-c]");

  cb.forEach(function(b){b.onclick=function(){cat=b.dataset.c;renderTabs();renderList();};});
}
function renderList(){
  var list = DATA.filter(function(d){
